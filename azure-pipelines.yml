resources:
  repositories:
    - repository: Maple.iText.ProblemPDFs
      type: github
      endpoint: Maple-Reinders
      name: Maple-Reinders/Maple.iText.ProblemPDFs
      ref: main

trigger:
- maple-package

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  # With multiple checkouts, the repo is in a subfolder of $(Build.SourcesDirectory).
  # DotNetCoreCLI resolves 'projects' against $(System.DefaultWorkingDirectory), not 'workingDirectory', so use absolute paths.
  # Note: the 'test' command only warns when no project matches, so a wrong path here silently skips the tests.
  repoDirectory: '$(Build.SourcesDirectory)/Maple.PDFSharp'
  testProject: '$(repoDirectory)/src/foundation/src/PDFsharp/tests/Maple.PDFsharp.ProblemPDF.Tests/Maple.PDFsharp.ProblemPDF.Tests.csproj'
  packageProject: '$(repoDirectory)/src/foundation/nuget/src/PDFsharp.NuGet/PDFsharp.NuGet.csproj'

steps:
# GitVersion.MsBuild needs the full history and tags.
- checkout: self
  path: s\Maple.PDFSharp
  persistCredentials: true
  clean: true
  fetchDepth: 0
  fetchTags: true
# The problem PDFs are private. They are checked out into the (git-ignored) ProblemPDFs folder and read in place by the tests.
- checkout: Maple.iText.ProblemPDFs
  path: s\Maple.PDFSharp\ProblemPDFs

# The projects target net10.0, so the .NET 10 SDK is needed to build.
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

# UseDotNet makes 'dotnet' resolve to the tool cache, which only contains what is installed there.
# The tests run on net8.0, so the .NET 8 runtime must be installed next to the SDK.
- task: UseDotNet@2
  displayName: 'Install .NET 8 runtime'
  inputs:
    packageType: 'runtime'
    version: '8.x'

- task: DotNetCoreCLI@2
  displayName: 'Test problem PDFs'
  inputs:
    command: 'test'
    projects: '$(testProject)'
    arguments: '--configuration $(buildConfiguration)'
    workingDirectory: '$(repoDirectory)'

# GeneratePackageOnBuild creates Maple.PDFsharp.<version>.nupkg.
- task: DotNetCoreCLI@2
  displayName: 'Build Maple.PDFsharp package'
  inputs:
    command: 'build'
    projects: '$(packageProject)'
    arguments: '--configuration $(buildConfiguration)'
    workingDirectory: '$(repoDirectory)'

- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    command: 'push'
    packagesToPush: '$(repoDirectory)/**/bin/$(buildConfiguration)/Maple.PDFsharp.*.nupkg;!$(repoDirectory)/**/*.symbols.nupkg'
    nuGetFeedType: 'internal'
    publishVstsFeed: 'e786d536-6655-44c0-be8c-e893a91d0e8e/528f8f46-d747-443c-90d8-7bcaed97c514'
