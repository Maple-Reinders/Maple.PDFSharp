resources:
  repositories:
    - repository: Maple.iText.ProblemPDFs
      type: github
      endpoint: Maple-Reinders
      name: Maple-Reinders/Maple.iText.ProblemPDFs
      ref: main

trigger:
- maple-package

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  testProject: 'src/foundation/src/PDFsharp/tests/Maple.PDFsharp.ProblemPDF.Tests/Maple.PDFsharp.ProblemPDF.Tests.csproj'
  packageProject: 'src/foundation/nuget/src/PDFsharp.NuGet/PDFsharp.NuGet.csproj'

steps:
# GitVersion.MsBuild needs the full history and tags.
- checkout: self
  path: s\Maple.PDFSharp
  persistCredentials: true
  clean: true
  fetchDepth: 0
  fetchTags: true
# The problem PDFs are private. They are checked out into the (git-ignored) ProblemPDFs folder and read in place by the tests.
- checkout: Maple.iText.ProblemPDFs
  path: s\Maple.PDFSharp\ProblemPDFs

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: DotNetCoreCLI@2
  displayName: 'Test problem PDFs'
  inputs:
    command: 'test'
    projects: '$(testProject)'
    arguments: '--configuration $(buildConfiguration)'
    workingDirectory: '$(Build.SourcesDirectory)/Maple.PDFSharp'

# GeneratePackageOnBuild creates Maple.PDFsharp.<version>.nupkg.
- task: DotNetCoreCLI@2
  displayName: 'Build Maple.PDFsharp package'
  inputs:
    command: 'build'
    projects: '$(packageProject)'
    arguments: '--configuration $(buildConfiguration)'
    workingDirectory: '$(Build.SourcesDirectory)/Maple.PDFSharp'

- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    command: 'push'
    packagesToPush: '$(Build.SourcesDirectory)/Maple.PDFSharp/**/bin/$(buildConfiguration)/Maple.PDFsharp.*.nupkg;!$(Build.SourcesDirectory)/Maple.PDFSharp/**/*.symbols.nupkg'
    nuGetFeedType: 'internal'
    publishVstsFeed: 'e786d536-6655-44c0-be8c-e893a91d0e8e/528f8f46-d747-443c-90d8-7bcaed97c514'
